<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="shortcut icon" href="fav.webp" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.min.css">
</head>
<body>
    <!-- navbar -->
    <nav class="border-b bg-white/50 backdrop-blur-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i data-lucide="check-square-2" class="w-6 h-6 text-primary"></i>
                    <span class="font-semibold text-lg">taskflow</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-1 text-sm text-muted-foreground">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span id="currentDate"></span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
                        <i data-lucide="user" class="w-4 h-4 text-primary"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- main content -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <!-- header section -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Tasks</h1>
            <p class="text-muted-foreground mt-1">Manage your daily tasks and stay organized</p>
        </div>

        <!-- stats grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="stat-card flex items-center justify-between">
                <span class="text-sm text-muted-foreground">Total tasks</span>
                <span class="text-2xl font-semibold" id="totalTasks">0</span>
            </div>
            <div class="stat-card flex items-center justify-between">
                <span class="text-sm text-muted-foreground">Completed</span>
                <span class="text-2xl font-semibold text-green-600" id="completedTasks">0</span>
            </div>
            <div class="stat-card flex items-center justify-between">
                <span class="text-sm text-muted-foreground">Pending</span>
                <span class="text-2xl font-semibold text-orange-500" id="pendingTasks">0</span>
            </div>
        </div>

        <!-- add task form -->
        <div class="bg-white rounded-xl border p-6 mb-6">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="What needs to be done?" 
                        class="shadcn-input"
                    >
                </div>
                <div class="flex gap-2">
                    <select id="taskPriority" class="shadcn-input w-auto">
                        <option value="low">Low priority</option>
                        <option value="medium" selected>Medium priority</option>
                        <option value="high">High priority</option>
                    </select>
                    <button id="addTaskBtn" class="shadcn-button">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Add task
                    </button>
                </div>
            </div>
        </div>

        <!-- filters and actions -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <div class="flex items-center gap-2 bg-white rounded-lg border p-1">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="flex items-center gap-2">
                <button id="selectAllBtn" class="shadcn-button-ghost shadcn-button text-sm px-3 py-1.5">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    Select all
                </button>
                <button id="clearCompletedBtn" class="shadcn-button-destructive shadcn-button text-sm px-3 py-1.5">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    Clear completed
                </button>
            </div>
        </div>

        <!-- tasks list -->
        <div class="bg-white rounded-xl border">
            <div class="p-4 border-b bg-slate-50/50">
                <div class="flex items-center gap-4 text-xs font-medium text-muted-foreground">
                    <span class="w-8"></span>
                    <span class="flex-1">Task</span>
                    <span class="w-20">Priority</span>
                    <span class="w-20">Status</span>
                    <span class="w-10"></span>
                </div>
            </div>
            <div id="taskList" class="divide-y max-h-[400px] overflow-y-auto">
                <!-- tasks will be injected here -->
            </div>
            
            <!-- empty state (hidden by default) -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 px-4">
                <i data-lucide="clipboard-list" class="w-16 h-16 stroke-1 text-slate-300 mb-4"></i>
                <h3 class="text-lg font-medium text-slate-700 mb-1">No tasks yet</h3>
                <p class="text-sm text-slate-500 text-center mb-4">Add your first task to get started</p>
                <button id="emptyAddBtn" class="shadcn-button text-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Add your first task
                </button>
            </div>
        </div>

        <!-- footer note -->
        <div class="mt-6 text-center text-xs text-muted-foreground">
            <p>✨ Task Manager — built with Tailwind CSS and Lucide icons</p>
        </div>
    </main>

    <script src="script.min.js"></script>
</body>
</html>
